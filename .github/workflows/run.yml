name: Run Gmail Bot

# Cấu hình thời gian và cách kích hoạt con bot
on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công bất cứ lúc nào trên web
  schedule:
    - cron: '0 1 * * *' # Tự động chạy ngầm mỗi ngày vào lúc 1:00 AM (giờ UTC)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Tải mã nguồn của repository xuống máy chủ ảo
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Python phiên bản mới nhất
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Chạy file bot.py và truyền các "két sắt" GitHub Secrets vào biến môi trường
    - name: Run bot script
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      run: |
        python bot.py
