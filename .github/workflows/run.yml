name: Run Gmail Bot Once

# Chỉ cho phép bấm chạy thủ công hoặc hẹn giờ chạy đúng một lần duy nhất
on:
  workflow_dispatch:
  schedule:
    # Cú pháp cron hẹn giờ: Chạy sau khoảng 5 phút nữa (tính theo giờ UTC)
    # Hiện tại là 12:40 PM +07 -> tương đương 05:40 UTC. 
    # Bấm lịch chạy vào phút thứ 45, giờ 05 (tức 12:45 trưa giờ VN, vừa đúng 5 phút nữa)
    - cron: '45 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Tải mã nguồn xuống
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Cài đặt Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Chạy file bot.py
    - name: Run bot script
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      run: |
        python bot.py
